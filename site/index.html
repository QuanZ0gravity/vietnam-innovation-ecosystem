<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bản đồ hệ sinh thái khởi nghiệp ĐMST Việt Nam</title>
<style>
:root{--bg:#F4F7F6;--card:#fff;--ink:#11313B;--muted:#56696E;--line:#D3DEDC;--sea:#157A7B;--soft:#DCEEEC;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1F24;--card:#16292F;--ink:#E6EEEC;--muted:#9FB3B6;--line:#2A4148;--sea:#5CC2C3;--soft:#1D3A3F;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1100px;margin:0 auto;padding:32px 20px 64px}h1{font-size:1.9rem;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 20px}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px}.stat b{display:block;font-size:1.4rem}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}input,select{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);min-height:44px}input{flex:1 1 260px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.card h2{font-size:1rem;margin:0}.tag{display:inline-block;font-size:.8rem;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--ink)}.muted{color:var(--muted);font-size:.9rem}a{color:var(--sea)}
footer{margin-top:32px;color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main>
<h1>Bản đồ hệ sinh thái khởi nghiệp ĐMST Việt Nam</h1>
<p class="sub">Dữ liệu mở, cộng đồng cùng duy trì. Bắt đầu từ TP Đà Nẵng.</p>
<div class="stats" id="stats"></div>
<div class="bar">
<label for="q" class="muted" style="position:absolute;left:-9999px">Tìm theo tên</label>
<input id="q" type="search" placeholder="Tìm theo tên">
<label for="t" class="muted" style="position:absolute;left:-9999px">Loại</label>
<select id="t"><option value="">Mọi loại</option></select>
<label for="v" class="muted" style="position:absolute;left:-9999px">Mức xác minh</label>
<select id="v"><option value="">Mọi mức xác minh</option></select>
</div>
<p class="muted" id="count"></p>
<div class="grid" id="grid"></div>
<footer>Dữ liệu theo giấy phép CC BY 4.0 · <a href="data/actors.csv">Tải CSV</a> · <a href="data/actors.json">JSON</a> · Sửa hoặc thêm hồ sơ: xem CONTRIBUTING.md trong kho mã.</footer>
</main>
<script>
const TYPE={startup:"Startup",creator:"Dự án sáng tạo",company:"Doanh nghiệp",fund:"Quỹ, nhà đầu tư",incubator:"Vườn ươm",accelerator:"Tăng tốc",space:"Không gian ĐMST",university:"Viện, trường",government:"Cơ quan nhà nước",support_org:"Tổ chức hỗ trợ",international:"Đối tác quốc tế",community:"Cộng đồng",media:"Truyền thông"};
const VER={unverified:"Chưa xác minh",source_checked:"Đã đối chiếu nguồn",org_confirmed:"Tổ chức xác nhận",partner_verified:"Đối tác xác minh"};
let all=[];
const $=id=>document.getElementById(id);
function el(tag,txt,cls){const e=document.createElement(tag);if(txt)e.textContent=txt;if(cls)e.className=cls;return e}
function render(){
  const q=$("q").value.trim().toLowerCase(),t=$("t").value,v=$("v").value;
  const list=all.filter(a=>(!t||a.type===t)&&(!v||a.verification.level===v)&&(!q||a.name.vi.toLowerCase().includes(q)));
  $("count").textContent=list.length+" kết quả";
  const g=$("grid");g.replaceChildren();
  for(const a of list.slice(0,300)){
    const c=el("article",null,"card");c.append(el("h2",a.name.vi));
    const tags=el("div");tags.append(el("span",TYPE[a.type]||a.type,"tag"));c.append(tags);
    if(a.description&&a.description.vi)c.append(el("p",a.description.vi,"muted"));
    c.append(el("p",VER[a.verification.level],"muted"));
    if(a.website){const l=el("a","Website");l.href=a.website;l.rel="noopener";c.append(l)}
    g.append(c);
  }
}
fetch("data/actors.json").then(r=>r.json()).then(d=>{
  all=d.sort((a,b)=>a.name.vi.localeCompare(b.name.vi,"vi"));
  const types=[...new Set(all.map(a=>a.type))];
  for(const t of types){const o=el("option",TYPE[t]||t);o.value=t;$("t").append(o)}
  for(const k of Object.keys(VER)){const o=el("option",VER[k]);o.value=k;$("v").append(o)}
  const s=$("stats");
  const add=(n,l)=>{const d=el("div",null,"stat");d.append(el("b",String(n)),el("span",l,"muted"));s.append(d)};
  add(all.length,"tác nhân");add(all.filter(a=>a.type==="startup").length,"startup");
  add(all.filter(a=>a.verification.level!=="unverified").length,"đã đối chiếu");
  render();
});
["q","t","v"].forEach(id=>$(id).addEventListener("input",render));
</script>
</body>
</html>
