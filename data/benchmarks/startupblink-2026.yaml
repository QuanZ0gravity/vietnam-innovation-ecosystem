  insights:
  - text: Tăng 12 bậc lên hạng 98, lần đầu vào top 100 thế giới; giữ hạng 5 Đông Nam Á.
    source: StartupBlink, Global Startup Ecosystem Index 2026 (báo cáo, tr. 239–242)
  - text: Dẫn đầu Đông Nam Á về độ trưởng thành của hệ sinh thái (nhóm chỉ số Ecosystem Maturity), nhờ thành tích startup đã đạt được.
    source: StartupBlink, Global Startup Ecosystem Index 2026 (báo cáo, tr. 239–242)
  - text: Fintech hạng 3 Đông Nam Á, hạng 60 thế giới; Blockchain hạng 5 Đông Nam Á, hạng 70 thế giới.
    source: StartupBlink, Global Startup Ecosystem Index 2026 (báo cáo, tr. 239–242)
  - text: Nơi có MoMo, Sky Mavis và Tiki. Sở KH&CN quản lý SIHUB, BSSC và đồng tổ chức InnoEx.
    source: StartupBlink, Global Startup Ecosystem Index 2026 (báo cáo, tr. 239–242)
  - text: Nền tảng HOIP của Trung tâm Khởi nghiệp sáng tạo TP.HCM (SIHUB) có 200 hồ sơ startup, khoảng 40 chuyên gia, 11 nhà đầu tư và 45 vườn ươm, tổ chức hỗ trợ.
    source: HOIP – Nền tảng kết nối ĐMST TP.HCM do SIHUB vận hành (truy cập 22/11/2026)
  - text: 82 trong 200 startup trên HOIP (41%) thành lập năm 2025, cho thấy nhiều hồ sơ còn ở giai đoạn ý tưởng hoặc mới thành lập.
    source: HOIP – Nền tảng kết nối ĐMST TP.HCM do SIHUB vận hành (truy cập 22/11/2026)
  - text: 'Lĩnh vực nhiều startup nhất trên HOIP: phần mềm, CNTT (68); dịch vụ (25); thực phẩm, nông lâm nghiệp (24); chế biến, chế tạo (19).'
    source: HOIP – Nền tảng kết nối ĐMST TP.HCM do SIHUB vận hành (truy cập 22/11/2026)
  - text: Thành phố hỗ trợ startup theo cơ chế đặc thù của Nghị quyết 20/2024/NQ-HĐND, ví dụ chương trình Fintech 2025 với gói ươm tạo tới 400 triệu đồng mỗi dự án và chương trình ươm tạo qua cuộc thi Startup Wheel cùng BSSC.
    source: HOIP – Nền tảng kết nối ĐMST TP.HCM do SIHUB vận hành (truy cập 22/11/2026)
  - text: TP.HCM chiếm khoảng 50% số startup, 40% cơ sở ươm tạo và hỗ trợ khởi nghiệp, 44% vốn đầu tư và 60% số thương vụ của cả nước.
    source: SIHUB – sihub.gov.vn (truy cập 22/11/2026)
  - text: Giá trị hệ sinh thái khoảng 7,5 tỷ USD (Startup Genome 2024); vốn đầu tư mạo hiểm khoảng 260 triệu USD qua 77 thương vụ (Do Ventures tổng hợp); khoảng 100 quỹ đầu tư hoạt động (Báo cáo đầu tư sáng tạo Việt Nam 2025).
    source: SIHUB – sihub.gov.vn (truy cập 22/11/2026)
  - text: Ngày 17/4/2026, thành phố công bố Quỹ Đầu tư mạo hiểm TP.HCM, quỹ có vốn nhà nước đóng vai trò vốn mồi để đồng đầu tư cùng quỹ tư nhân.
    source: SIHUB – sihub.gov.vn (truy cập 22/11/2026)
  - text: Giai đoạn 2024–2025, Nghị quyết 20/2023/NQ-HĐND hỗ trợ 179 dự án qua 35 nhiệm vụ, tổng kinh phí hơn 18,3 tỷ đồng. Dự thảo chính sách mới (7/2026) đề xuất hỗ trợ không hoàn lại tới 50 triệu đồng (tiền ươm tạo), 100 triệu đồng (ươm tạo) và 500 triệu đồng (tăng tốc) mỗi dự án, qua tổ chức trung gian.
    source: SIHUB – sihub.gov.vn (truy cập 22/11/2026)
  - text: Tòa nhà SIHUB tại 123 Trương Định khánh thành tháng 8/2025; SIHUB hợp tác với Plug and Play từ 5/2026 và có mạng lưới đối tác gồm 13 trường đại học, 2 khu công nghệ Hàn Quốc.
    source: SIHUB – sihub.gov.vn (truy cập 22/11/2026)
  - text: Dữ liệu mở của Sở KH&CN ghi nhận 139 doanh nghiệp khoa học và công nghệ và khoảng 460 tổ chức khoa học và công nghệ (viện, trung tâm nghiên cứu) tại TP.HCM.
    source: Cổng dữ liệu mở TP.HCM – Sở KH&CN TP.HCM (truy cập 22/11/2026)
  - text: '732 nhiệm vụ, đề tài, đề án KH&CN của thành phố; nhiều nhất là khoa học xã hội và nhân văn (405) và công nghệ sinh học (152). Đơn vị chủ trì nhiều nhất: Trung tâm Công nghệ Sinh học Thành phố Hồ Chí Minh, Viện Nghiên cứu phát triển Thành phố Hồ Chí Minh, Trường Đại học Bách khoa Thành phố Hồ Chí Minh, Viện Sinh học Nhiệt đới.'
    source: Cổng dữ liệu mở TP.HCM – Sở KH&CN TP.HCM (truy cập 22/11/2026)
