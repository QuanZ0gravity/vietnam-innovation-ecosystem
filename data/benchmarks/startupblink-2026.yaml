  - text: Tăng 5 bậc lên hạng 50 thế giới, vị trí cao nhất từ khi có bảng xếp hạng; giữ hạng 5 Đông Nam Á và hạng 10 châu Á.
    source: StartupBlink, Global Startup Ecosystem Index 2026 (báo cáo, tr. 239–242)
