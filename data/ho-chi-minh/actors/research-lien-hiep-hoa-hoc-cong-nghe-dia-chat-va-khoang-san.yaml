description_source:
  text: '- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: địa chất học; khoáng vật học; trắc địa học và bản đồ học. - Dịch vụ KH&CN: tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (không cấp văn bằng, chứng chỉ). - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
