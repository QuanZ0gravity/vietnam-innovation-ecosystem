- Trung tâm nghiên cứu
address: Khu Phố 6, Phường Đông Hòa, Phường Dĩ An, TP. Hồ Chí Minh
description:
  vi: Tổ chức khoa học và công nghệ tại TP.HCM, trực thuộc Trường Đại học Sức khỏe Thành phố Hồ Chí Minh.
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong các lĩnh vực: sức khỏe sinh sản và di truyền phân tử, nghiên cứu tác dụng của dược phẩm, dược liệu và các kỹ thuật điều trị. 2. Sản xuất thử - thử nghiệm, sản xuất – kinh doanh các sản phẩm là kết quả nghiên cứu. 3. Dịch vụ KH&CN: kiểm định chất lượng các phòng thí nghiệm, chuyển giao công nghệ, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
