id: research-vien-nghien-cuu-va-phat-trien-nong-nghiep-huu-co-a-chau
name:
  vi: Viện Nghiên cứu và Phát Triển Nông Nghiệp Hữu Cơ Á Châu
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện nghiên cứu
address: 61, Phổ Quang, Phường Tân Sơn Hòa, Thành phố Hồ Chí Minh
description:
  vi: Tổ chức khoa học và công nghệ tại TP.HCM.
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực nông nghiệp hữu cơ phục vụ: Cây công nghiệp và cây dược liệu; Cây rau, cây hoa và cây ăn quả; Cây lương thực và cây thực phẩm; Nông lâm kết hợp; Nông hoá; Thổ nhưỡng; Chọn, tạo giống cây trồng; Công nghệ nhân giống cây trồng; Bảo vệ thực vật; Bảo quản và chế biến nông sản; Khảo nghiệm giống cây trồng, phân bón và thuốc bảo vệ thực vật; Công nghệ vi sinh vật trong nông nghiệp; Công nghệ sản xuất thuốc trừ sâu sinh học; Công nghệ sản phẩm sinh học; Công nghệ xử lý sinh học; 2. Sản xuất thử nghiệm, sản xuất kinh doanh sản phẩm là kết quả nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực đăng ký. 3. Dịch vụ khoa học và công nghệ: tổ chức hội nghị, hội thảo khoa học; Tư vấn, phản biện, đánh giá, chuyển giao nghiên cứu khoa học, thông tin khoa học công nghệ, huấn luyện chuyên môn theo các lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng chứng chỉ). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù
    hợp với Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
