id: research-trung-tam-nghien-cuu-trien-khai-khu-cong-nghe-cao
name:
  vi: Trung tâm Nghiên cứu Triển khai Khu công nghệ cao
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: Lô 13, Đường N2, Phường Tăng Nhơn Phú A, Thành phố Thủ Đức
description:
  vi: Tổ chức khoa học và công nghệ tại TP.HCM, trực thuộc Ban Quản lý Khu Công nghệ cao Thành phố Hồ Chí Minh. Chủ trì 17 nhiệm vụ KH&CN cấp thành phố.
description_source:
  text: '- Nghiên cứu triển khai ứng dụng trong các lĩnh vực: công nghệ vi mạch, công nghệ thông tin, viễn thông; công nghệ cơ khí chính xác, tự động hóa; công nghệ vật liệu mới, vật liệu nano; công nghệ sinh học ứng dụng vào y học, dược phẩm, nông nghiệp, môi trường và các lĩnh vực công nghệ cao khác. - Sản xuất thử nghiệm, tạo mẫu nhanh các sản phẩm công nghệ cao, chuyển giao công nghệ từ kết quả nghiên cứu. - Dịch vụ KH&CN: Tư vấn, thông tin khoa học và công nghệ, đào tạo bồi dưỡng theo lĩnh vực đăng ký. - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
