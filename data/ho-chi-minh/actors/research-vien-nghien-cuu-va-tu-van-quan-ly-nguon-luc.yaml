description_source:
  text: '1- Nghiên cứu và triển khai ứng dụng khoa học và công nghệ về phát triển nguồn nhân lực nhân tài. 2- Dịch vụ KH&CN: Tư vấn đầu tư, lập và thẩm định dự án đầu tư, tư vấn đấu thầu, quản lý dự án, quản trị doanh nghiệp, tư vấn xây dựng và đánh giá hệ thống quản lý chất lượng, chất lượng hàng hóa, tư vấn chuyển giao công nghệ; thông tin khoa học và công nghệ; đào tạo bồi dưỡng nguồn nhân lực. 3- Hợp tác trong và ngoài nước trên các lĩnh vực đăng ký.'
