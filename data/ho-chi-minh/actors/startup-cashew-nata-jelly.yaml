  vi: 'Hồ sơ trên HOIP: lĩnh vực F&B, sản xuất thực phẩm, nông/lâm nghiệp, sinh học, CNSH, môi trường, chế biến, chế tạo; thành lập năm 2025; giai đoạn Proof of Concept (POC).'
description_source:
  text: https://www.facebook.com/profile.php?id=61577372858444 Sinh học, CNSH, CN chế biến/ chế tạo, Môi trường, F&B, Sản xuất TP, Nông/Lâm nghiệp Mô Hình Kinh Doanh Xanh và Bền Vững, Mô Hình Truyền Thống, Mô Hình Ngang Hàng (P2P) 02-01-2025 Việt Nam Hồ Chí Minh The Jellyvators là nhóm sinh viên Trường Đại học Bách khoa – ĐHQG TP.HCM, với khát vọng biến phụ phẩm nông nghiệp thành sản phẩm xanh, giàu giá trị. Dự án “Cashew Nata Jelly – Thạch điều lên men từ quả điều bỏ đi” sử dụng công nghệ lên men sinh học với vi khuẩn Acetobacter xylinum để tạo ra thạch điều giòn dai, thanh mát, giàu chất xơ, ít calo và không gelatin. Sản phẩm vừa là topping lành mạnh thay thế thạch dừa, vừa góp phần giảm lãng phí nông sản, tăng thu nhập cho nông dân và thúc đẩy kinh tế tuần hoàn. 🌟 Thành tích nổi bật 🥉 Giải Khuyến khích Bachkhoa Innovation 2025 🥈 Giải Nhì Sáng tạo Thanh thiếu niên tỉnh Bà Rịa – Vũng Tàu 🏅 Huy chương Đồng ScienceCastle Asia 2025 The Jellyvators hướng tới đưa thạch điều Việt Nam trở thành
    sản phẩm xanh đặc trưng, mang dấu ấn sáng tạo trẻ Việt trên thị trường quốc tế.
