id: research-vien-tham-my-chong-lao-hoa-te-bao-goc
name:
  vi: Viện Thẩm Mỹ Chống Lão Hoá Tế Bào Gốc
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện/Trung tâm nghiên cứu
address: 1015 Trần Hưng Đạo, Phường An Đông, TP. Hồ Chí Minh
description:
  vi: Tổ chức khoa học và công nghệ tại TP.HCM, trực thuộc Công ty Cổ phần Bệnh viện đa khoa Quốc tế DNA.
description_source:
  text: '1. Nghiên cứu khoa học, phát triển công nghệ trong lĩnh vực: Công nghệ tế bào gốc trong y học; công nghệ sinh học liên quan đến y học, y tế; Y học thẩm mỹ, tạo hình. 2. Sản xuất thử nghiệm, sản xuất kinh doanh sản phẩm là kết quả nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực đăng ký. 3. Dịch vụ khoa học và công nghệ: Tổ chức hội nghị, hội thảo, thông tin khoa học công nghệ, tư vấn, chuyển giao kết quả nghiên cứu; tập huấn, bồi dưỡng chuyên môn theo lĩnh vực đăng ký phù hợp với Luật định (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
