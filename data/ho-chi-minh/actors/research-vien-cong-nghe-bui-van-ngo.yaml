id: research-vien-cong-nghe-bui-van-ngo
name:
  vi: Viện Công Nghệ Bùi Văn Ngọ
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 241, An Dương Vương, Phường An Lạc, TP. Hồ Chí Minh
description:
  vi: Tổ chức khoa học và công nghệ tại TP.HCM, trực thuộc Công ty TNHH Bùi Văn Ngọ Cơ khí Sài Gòn.
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: kỹ thuật điện, điện tử; công nghệ thông tin và truyền thông; kỹ thuật cơ khí và công nghệ chế tạo máy. 2. Kinh doanh và sản xuất kinh doanh các sản phẩm là kết quả nghiên cứu. 3. Dịch vụ khoa học và công nghệ: tổ chức Hội nghị, Hội thảo, tư vấn, bồi dưỡng chuyên môn, chuyển giao công nghệ, thông tin khoa học và công nghệ theo lĩnh vực đăng ký phù hợp Luật định (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
