id: incubator-trung-tam-uom-tao-doanh-nghiep-cong-nghe-dai-hoc-nong-lam-ct
name:
  vi: Trung tâm Uơm tạo Doanh nghiệp Công nghệ - Đại học Nông Lâm (CTBI)
alt_names:
- Trung tâm Ươm tạo Doanh nghiệp công nghệ - Đại học Nông Lâm Thành phố Hồ Chí Minh
type: incubator
categories:
- Tổ chức khoa học và công nghệ
founded: 2008
address: Khu Phố 6, Phường Đông Hòa, Phường Dĩ An, TP. Hồ Chí Minh
description_source:
  text: '1- Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: nông lâm ngư nghiệp; bảo quản chế biến và cơ điện phục vụ nông nghiệp; công nghệ sinh học nông nghiệp, công nghệ thông tin. 2- Sản xuất thử - thử nghiệm từ kết quả nghiên cứu. 3- Dịch vụ KH&CN: Tư vấn, chuyển giao công nghệ, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng theo lĩnh vực đăng ký (không cấp văn bằng, chứng chỉ). 4- Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
