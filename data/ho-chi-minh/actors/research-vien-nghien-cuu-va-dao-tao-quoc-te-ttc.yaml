id: research-vien-nghien-cuu-va-dao-tao-quoc-te-ttc
name:
  vi: Viện Nghiên cứu và Đào Tạo Quốc Tế Ttc
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện nghiên cứu
address: 253, Hoàng Văn Thụ, Phường Tân Sơn Hòa, Thành phố Hồ Chí Minh
description:
  vi: Tổ chức khoa học và công nghệ tại TP.HCM, trực thuộc Trường Đại học Yersin Đà Lạt tại Thành phố Hồ Chí Minh.
description_source:
  text: '1. Nghiên cứu khoa học về thị trường nhân lực, nhu cầu đào tạo quốc tế, dự báo những vấn đề liên quan đến công tác đào tạo, hội nhập quốc tế. 2. Dịch vụ khoa học và công nghệ: tư vấn, tập huấn, hướng nghiệp, đào tạo, bồi dưỡng chuyên môn, chuyển giao công nghệ theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
