id: research-trung-tam-tu-van-dau-tu-va-dich-vu-khcn-duong-bo-7
name:
  vi: Trung tâm Tư vấn Đầu tư và Dịch vụ KHCN Đường bộ 7
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 296, Nguyễn Văn Đậu, Phường Bình Lợi Trung, TP. Hồ Chí Minh
description:
  vi: Tổ chức khoa học và công nghệ tại TP.HCM.
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng công nghệ mới, phương pháp, biện pháp tổ chức quản lý, bảo trì, sửa chữa đường bộ, biên soạn tiêu chuẩn kỹ thuật thiết kế mẫu, định mức kinh tế- kỹ thuật sửa chữa công trình giao thông đường bộ. 2. Dịch vụ KH&CN: - tư vấn đầu tư, tư vấn thẩm tra an toàn giao thông, kiểm định, thẩm tra dự án xây dựng, sửa chữa công trình giao thông đường bộ, lập dự án đầu tư, khảo sát thiết kế, dự toán công trình và hồ sơ đấu thầu, các dự án sửa chữa, nâng cấp phà, phương tiện nổi (dưới 1000 tấn), ụ triền đà phục vụ sửa chữa phương tiện thủy theo Luật định. - Chuyển giao kết quả nghiên cứu, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng theo lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
