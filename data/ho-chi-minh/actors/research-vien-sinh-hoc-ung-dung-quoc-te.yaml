id: research-vien-sinh-hoc-ung-dung-quoc-te
name:
  vi: Viện Sinh Học Ứng Dụng Quốc Tế
type: research
categories:
- Tổ chức khoa học và công nghệ
address: Lê Thị Riêng, Phường Thới An, Thành phố Hồ Chí Minh
description:
  vi: Tổ chức khoa học và công nghệ tại TP.HCM.
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: Công nghệ quản lý và xử lý chất thải (rắn, lỏng, khí); Công nghệ phục hồi và tái tạo môi trường; Công nghệ xử lý môi trường bằng phương pháp sinh học; Công nghệ enzym và protein trong nông nghiệp; Công nghệ vi sinh vật trong nông nghiệp; Công nghệ sản xuất thuốc trừ sâu sinh học; Các công nghệ xử lý sinh học, xúc tác sinh học, lên men; Công nghệ sinh học liên quan đến y học, y tế; Dược học lâm sàng và điều trị; Dược liệu học; Cây thuốc; Con thuốc; Thuốc Nam; Thuốc dân tộc; Bào chế; Dược học cổ truyền; Thực phẩm chức năng; Cây lương thực và cây thực phẩm; Cây rau, cây hoa và cây ăn quả; Cây công nghiệp và cây dược liệu; Chọn, tạo giống cây trồng; Công nghệ nhân giống cây trồng; Bảo vệ thực vật; Hệ sinh thái, sinh lý và dinh dưỡng thủy sản; Chọn, tạo và nhân giống thủy sản; Bệnh thủy sản; Nuôi trồng thủy sản; Bảo quản và chế biến thủy sản. 2. Sản xuất thử - thử nghiệm; sản xuất - kinh doanh các sản phẩm là kết quả nghiên
    cứu và phát triển. 3. Dịch vụ KH&CN: Tổ chức hội nghị, hội thảo, Thông tin khoa học và công nghệ; Dịch vụ môi giới chuyển giao công nghệ, Dịch vụ tư vấn chuyển giao công nghệ; Tư vấn, phản biện, đánh giá, chuyển giao kết quả nghiên cứu khoa học trong lĩnh vực đăng ký; Tập huấn, bồi dưỡng chuyên môn cho các tổ chức, cá nhân có nhu cầu theo các lĩnh vực đăng ký trên. (Chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền);'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
