description_source:
  text: '- Nghiên cứu quy hoạch và sử dụng hợp lý tài nguyên thiên nhiên, địa chất khoáng sản, địa chất công trình, địa chất thuỷ văn, địa chất môi trường, địa kỹ thuật và kỹ thuật dầu khí. - Sản xuất thử nghiệm và chuyển giao công nghệ từ kết quả nghiên cứu. (Khoa KT, Địa chất và Dầu khí – ĐHBK) - Dịch vụ KH&CN: Tư vấn, giám định công nghệ, thông tin, phân tích thử nghiệm, đào tạo bồi dưỡng về lĩnh vực đăng ký theo quy định pháp luật. - Hợp tác trong và ngoài nước trên lĩnh vực đăng ký.'
