id: research-vien-nghien-cuu-va-ung-dung-tam-ly-am-ngu-tri-lieu
name:
  vi: Viện Nghiên cứu và Ứng Dụng Tâm Lý - Âm Ngữ Trị Liệu
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện nghiên cứu
address: 110/27, Bà Hom, TP. Hồ Chí Minh
description:
  vi: Tổ chức khoa học và công nghệ tại TP.HCM, trực thuộc Công ty Cổ phần Đầu tư Giáo dục và Đào tạo Quốc tế Rồng Việt.
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: Tâm lý học nói chung (tâm lý học nhận thức; tâm lý học phát triển; tâm lý học lứa tuổi); tâm lý học chuyên ngành (điều trị rối loạn tâm sinh lý và tinh thần trong học tập, ngôn ngữ, nghe nhìn…). 2. Dịch vụ khoa học và công nghệ: Tư vấn, chuyển giao sản phẩm hình thành từ kết quả nghiên cứu; tổ chức hội nghị, hội thảo, tập huấn, bồi dưỡng chuyên môn cho các tổ chức cá nhân theo lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp với Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
