description:
  vi: Tổ chức khoa học và công nghệ tại TP.HCM.
description_source:
  text: '- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: công nghệ hóa hữu cơ; các công nghệ sản phẩm sinh học, vật liệu sinh học, chất dẻo sinh học, nhiên liệu sinh học, các hóa chất dược chiết tách từ sinh học, các vật liệu mới có nguồn gốc sinh học; công nghệ thực phẩm và đồ uống. - Sản xuất thử - thử nghiệm từ kết quả nghiên cứu. - Dịch vụ KH&CN: tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
