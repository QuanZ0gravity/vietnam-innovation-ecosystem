id: university-vien-john-von-neumann
name:
  vi: Viện John von Neumann
type: university
categories:
- Tổ chức khoa học và công nghệ
founded: 1933
address: Khu phố, Phường Linh Xuân, Thành phố Thủ Đức, Thành phố Hồ Chí Minh
description_source:
  text: '- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: khoa học hệ thống, khoa học tri thức, khoa học thông tin. - Sản xuất thử - thử nghiệm từ kết quả nghiên cứu. - Dịch vụ KH&CN: Tư vấn; chuyển giao công nghệ; tư vấn doanh nghiệp về đổi mới các quy trình về công nghệ, thông tin khoa học và công nghệ; đào tạo bồi dưỡng theo lĩnh vực đăng ký. - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
