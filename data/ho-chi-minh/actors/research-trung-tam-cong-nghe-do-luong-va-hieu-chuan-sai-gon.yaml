address: 151, Nguyễn Hữu Tiến, Phường Tây Thạnh, Thành phố Hồ Chí Minh
description:
  vi: Tổ chức khoa học và công nghệ tại TP.HCM, trực thuộc Công ty cổ phần công nghệ đo lường Sài Gòn.
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực hiệu chuẩn và đo lường. 2. Dịch vụ KH&CN: dịch vụ kiểm định, hiệu chuẩn, thử nghiệm phương tiện đo; dịch vụ bảo trì, bảo dưỡng và sửa chữa các phương tiện đo, thiết bị thử nghiệm, thiết bị kỹ thuật; tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học và công nghệ theo lĩnh vực đăng ký. 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
