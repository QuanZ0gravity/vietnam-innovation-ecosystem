  vi: Trung tâm Vật liệu Xây dựng Miền Nam
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 23, Đường 12, Phường An Khánh, Thành phố Thủ Đức, Thành phố Hồ Chí Minh
description:
  vi: Tổ chức khoa học và công nghệ tại TP.HCM, trực thuộc Viện Vật liệu Xây dựng.
description_source:
  text: '- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực vật liệu xây dựng. - Sản xuất thử - thử nghiệm các thiết bị, các dây chuyền công nghệ và chuyển giao công nghệ về vật liệu xây dựng, sản xuất – kinh doanh các sản phẩm là kết quả nghiên cứu. - Dịch vụ KH&CN: tư vấn xây dựng, lập dự án đầu tư, thiết kế, thẩm tra thiết kế và tổng dự toán công trình xây dựng, tư vấn đấu thầu, quản lý dự án, giám sát chất lượng xây lắp công trình, đảm bảo chất lượng công trình xây dựng dân dụng, công trình công nghiệp, xử lý và tái chế các loại phế thải, phối hợp thi công sửa chữa chống thấm tăng cường khả năng chịu ăn mòn cho các công trình xây dựng, huấn luyện bồi dưỡng nghiệp vụ chuyên môn theo lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
