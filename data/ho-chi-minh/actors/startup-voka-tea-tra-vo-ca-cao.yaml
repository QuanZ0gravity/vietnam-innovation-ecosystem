description:
  vi: 'Hồ sơ trên HOIP: lĩnh vực F&B; thành lập năm 2025; giai đoạn Sản phẩm / Dịch vụ Sơ khai (MVP).'
description_source:
  text: -- F&B Mô Hình Kinh Doanh Xanh và Bền Vững 06-06-2025 Việt Nam Toàn quốc Trà vỏ ca cao là trà thảo mộc làm từ vỏ trái ca cao – phụ phẩm thường bị bỏ đi. Kết hợp cùng với thảo dược tự nhiên tạo nên thức uống lành mạnh, thơm nhẹ, hậu ngọt tự nhiên và giàu dinh dưỡng. Sản phẩm góp phần hình thành chuỗi giá trị tuần hoàn mới – một sáng kiến xanh tái chế phụ phẩm nông nghiệp, nơi phụ phẩm được tái sinh thành sản phẩm có giá trị cho sức khỏe và kinh tế.
