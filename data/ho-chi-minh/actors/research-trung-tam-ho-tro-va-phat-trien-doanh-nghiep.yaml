id: research-trung-tam-ho-tro-va-phat-trien-doanh-nghiep
name:
  vi: Trung tâm hỗ trợ và phát triển doanh nghiệp Thành phố Hồ Chí Minh
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 156, Nam Kỳ Khởi Nghĩa, Phường Xuân Hòa, Thành phố Hồ Chí Minh
description:
  vi: Tổ chức khoa học và công nghệ tại TP.HCM, trực thuộc Sở Công thương Thành phố Hồ Chí Minh.
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực công nghệ, vật liệu nhựa cao su và khuôn mẫu. 2. Sản xuất thử- thử nghiệm trong lĩnh vực sản phẩm kỹ thuật cao ngành nhựa, cao su. 3. Dịch vụ KH&CN: hỗ trợ, cung cấp các dịch vụ cần thiết cho doanh nghiệp khởi nghiệp, hoạt động và phát triển phù hợp với quy định của WTO, các điều ước quốc tế, hiệp định song phương, đa phương mà Việt Nam là thành viên hoặc tham gia ký kết; ứng dụng, thí nghiệm, kiểm nghiệm, sản xuất thử, đào tạo nhân lực, chuyển giao công nghệ, thiết kế khuôn mẫu, phân tích đánh giá, kiểm định và chứng nhận chất lượng sản phẩm ngành nhựa, cao su; đào tạo nguồn nhân lực và nâng cao năng lực cán bộ quản lý năng lượng trong các cơ sở sử dụng năng lương trọng điểm của Thành phố và các tỉnh phía Nam 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
