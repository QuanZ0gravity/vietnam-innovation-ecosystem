description_source:
  text: '- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: quan hệ sản xuất kinh doanh, kinh doanh và quản trị kinh doanh. - Dịch vụ KH&CN: tư vấn áp dụng các công cụ quản lý chất lượng, chứng nhận hệ thống quản lý chất lượng, tư vấn xây dựng tiêu chuẩn, tư vấn chuyển giao công nghệ, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ được cấp chứng nhận, không cấp văn bằng, chứng chỉ). - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
