id: research-trung-tam-cong-nghe-nuoc-va-moi-truong
name:
  vi: Trung Tâm Công nghệ Nước Và Môi Trường
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 551/35, Đoàn Văn Bơ, TP. Hồ Chí Minh
description:
  vi: Tổ chức khoa học và công nghệ tại TP.HCM, trực thuộc Hội Nước và Môi Trường Thành phố Hồ Chí Minh.
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: Công nghệ sản xuất sạch, tái chế; công nghệ phục hồi và tái tạo môi trường; công nghệ quan trắc môi trường, kiếm soát vá xử lý ô nhiễm; công nghệ quản lý và xử lý chất thải (rắn, lỏng, khí); kiến trúc, kỹ thuật xây dựng; công trình hạ tầng đô thị; công trình giao thông vận tải; công trình thủy lợi; địa kỹ thuật. 2. Dịch vụ khoa học và công nghệ: Tổ chức hội nghị, hội thảo, thông tin khoa học và công nghệ, chuyển giao công nghệ, tư vấn xây dựng, tư vấn môi trường, bồi dưỡng chuyên môn theo các lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định./.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
