description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: công nghệ thông tin, xây dựng, điện tử - viễn thông. 2- Sản xuất thử - thử nghiệm từ kết quả nghiên cứu. 2. Dịch vụ KH&CN: tư vấn, chuyển giao kết quả nghiên cứu, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
