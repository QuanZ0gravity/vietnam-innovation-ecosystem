description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: quan hệ sản xuất kinh doanh; kinh doanh và quản trị kinh doanh. 2. Dịch vụ KH&CN: Tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (không cấp văn bằng, chứng chỉ). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
