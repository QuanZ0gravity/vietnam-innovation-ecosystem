- Trung tâm nghiên cứu
address: 224, Điện Biên Phủ, Phường Xuân Hòa, Thành phố Hồ Chí Minh
description:
  vi: Tổ chức khoa học và công nghệ tại TP.HCM, trực thuộc Liên hiệp các Hội Khoa học và Kỹ thuật Thành phố Hồ Chí Minh.
description_source:
  text: '1. Nghiên cứu khoa học, phát triển công nghệ trong lĩnh vực: quản trị kinh doanh và bất động sản. 2. Dịch vụ khoa học và công nghệ: Tư vấn, kết nối, trao đổi tiềm năng xu hướng thị trường bất động sản; Hỗ trợ về thủ tục đầu tư cũng như thông tin pháp lý về thị trường bất động sản; Tổ chức hội nghị, hội thảo, tập huấn, bồi dưỡng về lĩnh vực quản trị kinh doanh và lĩnh vực bất động sản theo quy định của pháp luật (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
