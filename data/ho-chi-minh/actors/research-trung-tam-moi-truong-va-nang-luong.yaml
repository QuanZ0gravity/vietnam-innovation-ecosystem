description:
  vi: Tổ chức khoa học và công nghệ tại TP.HCM.
description_source:
  text: '- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: công nghệ quản lý và xử lý chất thải (rắn, lỏng, khí); công nghệ quan trắc môi trường, kiểm soát và xử lý ô nhiễm; công nghệ sản xuất sạch và tái chế; công nghệ năng lượng và nhiên liệu không phải dầu khí. - Dịch vụ KH&CN: tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ được cấp chứng nhận, không cấp văn bằng, chứng chỉ). - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
