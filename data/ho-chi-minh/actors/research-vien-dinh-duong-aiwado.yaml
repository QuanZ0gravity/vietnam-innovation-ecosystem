address: 106, Nguyễn Văn Trỗi, TP. Hồ Chí Minh
description:
  vi: Tổ chức khoa học và công nghệ tại TP.HCM, trực thuộc Công ty Cổ phần AIWADO.
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ, nghiên cứu ứng dụng thử nghiệm về dinh dưỡng và thực phẩm. 2. Kinh doanh và sản xuất kinh doanh các sản phẩm là kết quả nghiên cứu trong lĩnh vực đăng ký. 3. Dịch vụ khoa học và công nghệ: tư vấn, chuyển giao công nghệ, thông tin khoa học và công nghệ; tham gia đào tạo, bồi dưỡng nghiệp vụ chuyên môn, tổ chức hội nghị, hội thảo khoa học theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp luật định'
