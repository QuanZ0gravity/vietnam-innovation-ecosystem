id: research-vien-do-thi-thong-minh
name:
  vi: Viện Đô Thị Thông Minh
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 24, Đường 40, Phường An Khánh, Thành phố Thủ Đức, Thành phố Hồ Chí Minh
description:
  vi: Tổ chức khoa học và công nghệ tại TP.HCM, trực thuộc Trường Đại học Kinh tế Thành phố Hồ Chí Minh.
description_source:
  text: '1. Nghiên cứu khoa học phát triển công nghệ và triển khai thực nghiệm trong lĩnh vực: Kiến trúc; Kỹ thuật xây dựng; Công trình hạ tầng đô thị; Công trình giao thông vận tải; Kỹ thuật điện và điện tử; Người máy và điều khiển tự động; Công nghệ tự động hóa và các hệ thống điều khiển, giám sát, điều khiển số bằng máy tính; Các hệ thống thông tin và truyền thông; Kỹ thuật, công nghệ viễn thông. 2. Sản xuất thử nghiệm, sản xuất kinh doanh sản phẩm là kết quả nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực đăng ký. 3. Dịch vụ Khoa học Công nghệ: Tổ chức hội nghị, hội thảo, Thông tin khoa học và công nghệ; Tư vấn chuyển giao công nghệ; Tư vấn, phản biện, đánh giá, chuyển giao kết quả nghiên cứu khoa học trong lĩnh vực đăng ký; Dịch vụ nghiên cứu xây dựng cơ sở dữ liệu (thư mục và toàn văn); Dịch vụ nghiên cứu xây dựng và phát triển hệ thống thông tin ngân hàng dữ liệu, lưu trữ điện tử; Tập huấn, bồi dưỡng chuyên môn theo các lĩnh vực đăng ký trên (chỉ được cấp giấy chứng nhận,
    đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp với Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
