address: 86, Đường số 5, Xã Phú Hoà Đông, Huyện Củ Chi, Thành phố Hồ Chí Minh
description:
  vi: Tổ chức khoa học và công nghệ tại TP.HCM, trực thuộc Công ty Cổ phần Phát triển Golden Smile.
description_source:
  text: '1. Hoạt động nghiên cứu khoa học, phát triển công nghệ và triển khai thực nghiệm trong lĩnh vực: Kinh doanh và quản trị kinh doanh; Quan hệ sản xuất kinh doanh; Địa lý kinh tế và văn hóa; Du lịch và xã hội. 2. Dịch vụ khoa học và công nghệ: Tư vấn, chuyển giao kết quả nghiên cứu; tổ chức hội nghị, hội thảo, tập huấn, bồi dưỡng cho các tổ chức cá nhân theo lĩnh vực đăng ký. (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp với Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
