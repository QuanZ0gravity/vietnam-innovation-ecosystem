description:
  vi: Tổ chức khoa học và công nghệ tại TP.HCM.
description_source:
  text: 1. Nghiên cứu và triển khai ứng dụng trong lĩnh vực điện, điện tử, thông tin và truyền thông. 2. Sản xuất thử - thử nghiệm và chuyển giao công nghệ từ kết quả nghiên cứu. 3. Dịch vụ KH-CN:Tư vấn, thẩm định, đánh giá chất lượng các loại công trình lĩnh vực điện, điện tử, thông tin, truyền thông; khảo sát, thiết kế, thẩm định dự án, thẩm định thiết kế, tư vấn đấu thầu, tư vấn giám sát và tư vấn quản lý dự án; cung cấp thông tin, huấn luyện bồi dưỡng nâng cao nghiệp vụ chuyên môn. 4. Hợp tác trong và ngoài nước trên lĩnh vực đăng ký.
