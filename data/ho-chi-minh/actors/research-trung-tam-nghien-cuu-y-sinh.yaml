id: research-trung-tam-nghien-cuu-y-sinh
name:
  vi: Trung Tâm Nghiên Cứu Y Sinh
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: Số 2 Dương Quang Trung, Phường Hòa Hưng, TP. Hồ Chí Minh
description:
  vi: Tổ chức khoa học và công nghệ tại TP.HCM, trực thuộc Trường Đại học Y khoa Phạm Ngọc Thạch.
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: Công nghệ sinh học, công nghệ vật liệu sinh học, công nghệ phôi, sinh học phân tử, công nghệ tế bào trong y học, di truyền y học, tế bào gốc, nghiên cứu tế bào ung thư, vi sinh y học và cơ xương khớp chuyển hóa. 2. Triển khai ứng dụng, sản xuất thử nghiệm, sản xuất kinh doanh các sản phẩm hình thành từ kết quả nghiên cứu khoa học. 3. Dịch vụ khoa học và công nghệ: Thực hiện các chẩn đoán y sinh chuyên sâu; tổ chức hội nghị, hội thảo; tư vấn, phản biện, đánh giá các nhiệm vụ khoa học và công nghệ; chuyển giao công nghệ; thông tin khoa học công nghệ; huấn luyện, bồi dưỡng chuyên môn cho các tổ chức, cá nhân có nhu cầu. 4. Hợp tác với các cá nhân, tổ chức trong và ngoài nước giúp nâng cao năng lực hoạt động và phát triển khoa học công nghệ phù hợp quy định pháp luật.'
