id: research-vien-doanh-nhan-duong-dai-lqt
name:
  vi: Viện Doanh Nhân Đương Đại Lqt
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 41-43, Võ Văn Tần, Phường Xuân Hòa, Thành phố Hồ Chí Minh
description:
  vi: Tổ chức khoa học và công nghệ tại TP.HCM.
description_source:
  text: '1. Nghiên cứu khoa học, phát triển công nghệ trong các lĩnh vực: Quan hệ sản xuất kinh doanh; Kinh doanh và quản trị kinh doanh. 2. Kinh doanh sản phẩm là kết quả nghiên cứu khoa học và phát triển công nghệ theo các lĩnh vực đăng ký. 3. Dịch vụ Khoa học và Công nghệ: Tổ chức hội nghị, hội thảo; Tư vấn, phản biện, đánh giá các nhiệm vụ khoa học và công nghệ; Chuyển giao nghiên cứu khoa học, thông tin khoa học công nghệ; Huấn luyện, bồi dưỡng chuyên môn ngắn hạn cho các tổ chức, cá nhân có nhu cầu theo các lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
