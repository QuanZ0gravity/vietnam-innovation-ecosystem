id: support-org-vien-cong-nghe-sinh-hoc-ung-dung-vbio
name:
  vi: Viện Công nghệ Sinh học Ứng dụng (VBio)
alt_names:
- Viện Công Nghệ Sinh Học Ứng Dụng
type: support_org
categories:
- Tổ chức khoa học và công nghệ
- Viện/Trung tâm nghiên cứu
founded: 1990
address: 25/27/9 Sơn Kỳ, Phường Tây Thạnh, TP. Hồ Chí Minh
description_source:
  text: '1. Nghiên cứu khoa học, phát triển công nghệ trong lĩnh vực: vi sinh vật học; Nấm học; Công nghệ gen, công nghệ nhân giống cây trồng và vật nuôi; Công nghệ vi sinh vật trong nông nghiệp; Công nghệ sản xuất thuốc trừ sâu sinh học; Công nghệ sinh học có liên quan đến y học, y tế; Chọn tạo giống cây trồng, công nghệ nhân giống cây trồng; Bảo quản chế biến nông sản; Lâm sinh, sinh thái và môi trường rừng. 2. Sản xuất thử nghiệm, sản xuất kinh doanh sản phẩm là kết quả nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực đăng ký. 3. Dịch vụ khoa học và công nghệ: Dịch vụ sưu tầm, xử lý bảo quản, nghiên cứu giám định, thẩm định và trao đổi mẫu vật về khoa học và công nghệ; dịch vụ chuyển giao công nghệ; dịch vụ khoa học và công nghệ khác bao gồm ươm tạo công nghệ và đầu tư doanh nghiệp đổi mới sáng tạo; thông tin phổ biến kiến thức; tổ chức hội nghị, hội thảo khoa học; tập huấn bồi dưỡng trình độ chuyên môn khoa học công nghệ theo lĩnh vực đã đăng ký (chỉ được cấp giấy chứng nhận,
    đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
