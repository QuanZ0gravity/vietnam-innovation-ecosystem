description:
  vi: Tổ chức khoa học và công nghệ tại TP.HCM, trực thuộc Trường Đại học Kinh tế Thành phố Hồ Chí Minh.
description_source:
  text: '1. Nghiên cứu khoa học và triển khai công nghệ trong lĩnh vực kinh tế, kinh doanh và quản lý. 2. Dịch vụ khoa học và công nghệ: tư vấn, kiến nghị phát triển kinh doanh và doanh nghiệp; đào tạo, bồi dưỡng chuyên môn về kinh doanh, kinh tế và quản lý; tổ chức hội nghị, hội thảo theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ) 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định'
