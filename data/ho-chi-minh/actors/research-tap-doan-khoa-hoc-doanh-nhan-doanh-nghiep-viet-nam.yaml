id: research-tap-doan-khoa-hoc-doanh-nhan-doanh-nghiep-viet-nam
name:
  vi: Tập Đoàn Khoa Học Doanh Nhân Doanh Nghiệp Việt Nam
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 207/3, Hồ Học Lãm, Phường An Lạc, TP. Hồ Chí Minh
description:
  vi: Tổ chức khoa học và công nghệ tại TP.HCM, trực thuộc Liên Hiệp Khoa học Kinh tế- Đô thị Nam bộ.
description_source:
  text: '1. Hoạt động nghiên cứu khoa học, phát triển công nghệ và triển khai thực nghiệm trong lĩnh vực: doanh nhân, doanh nghiệp và khởi nghiệp; Nghiên cứu thăm dò thị trường cho các loại hình khởi nghiệp thực tế; Nghiên cứu Xây dựng luận chứng khoa học cho các chương trình, dự án, kế hoạch, chính sách kinh tế - xã hội phát triển doanh nhân, doanh nghiệp khởi nghiệp, khởi nghiệp thực tế. 2. Xây dựng luận chứng khoa học cho các chương trình, dự án, kế hoạch và chính sách phát triển kinh tế - xã hội; 3. Nghiên cứu khoa học và quản lý, phát triển các tổ chức khoa học trực thuộc theo hướng kết hợp nghiên cứu, triển khai ứng dụng và đào tạo. 4. Thực hiện các dịch vụ khoa học và công nghệ: Tổ chức chuyển giao các đề tài, dự án, công trình khoa học có tính khả thi vào đời sống và sản xuất; Thông tin khoa học và công nghệ; Tiêu chuẩn, đo lường chất lượng; Đánh giá định mức tín nhiệm doanh nghiệp và các lĩnh vực kinh tế, văn hóa, xã hội; Giám sát độc lập các đề tài, dự án khoa học và công nghệ;
    Tổ chức hoạt động ươm tạo công nghệ mới, ươm tạo doanh nghiệp khoa học và công nghệ. 5. Tổ chức đào tạo và bồi dưỡng phát triển doanh nhân, doanh nghiệp. (chỉ cấp giấy chứng nhận, không cấp văn bằng chứng chỉ). 6. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp với luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
