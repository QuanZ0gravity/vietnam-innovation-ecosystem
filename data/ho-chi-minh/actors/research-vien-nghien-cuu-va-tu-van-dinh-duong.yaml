id: research-vien-nghien-cuu-va-tu-van-dinh-duong
name:
  vi: Viện Nghiên cứu và Tư Vấn Dinh Dưỡng
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện nghiên cứu
address: 105, Trần Thiện Chánh, Phường Nhiêu Lộc, TP. Hồ Chí Minh
description:
  vi: Tổ chức khoa học và công nghệ tại TP.HCM, trực thuộc Công ty TNHH Dịch vụ y tế H&H.
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: Y học dân tộc, cổ truyền; Dinh dưỡng; Y tế công cộng; Thực phẩm chức năng; Da liễu, hoa liễu. 2. Kinh doanh, sản xuất kinh doanh, sản xuất thử nghiệm các sản phẩm hình thành từ kết quả nghiên cứu. 3. Dịch vụ khoa học và công nghệ: Tổ chức hội nghị, hội thảo, Thông tin khoa học và công nghệ; Dịch vụ môi giới chuyển giao công nghệ; Dịch vụ tư vấn chuyển giao công nghệ; Dịch vụ thử nghiệm chất lượng sản phẩm hàng hóa; Dịch vụ giám định số lượng, chất lượng sản phẩm, hàng hóa; Tư vấn, phản biện, đánh giá, chuyển giao kết quả nghiên cứu khoa học trong lĩnh vực đăng ký; Tập huấn, bồi dưỡng chuyên môn cho các tổ chức, cá nhân có nhu cầu theo các lĩnh vực đăng ký trên. 4. Hợp tác với các tổ chức, cá nhân trong và ngoài nước theo các lĩnh vực đăng ký phù hợp với luật định.'
