address: 176, Hai Bà Trưng, Phường Trung Mỹ Tây, Thành phố Hồ Chí Minh
description:
  vi: Tổ chức khoa học và công nghệ tại TP.HCM, trực thuộc Ban Quản lý Khu Công nghệ cao Thành phố Hồ Chí Minh. Chủ trì 28 nhiệm vụ KH&CN cấp thành phố.
description_source:
  text: '- Nghiên cứu cơ bản và ứng dụng trong công nghệ sinh học, nông nghiệp, y dược và môi trường. - Sản xuất thử nghiệm, chuyển giao công nghệ, triển khai các quy trình kỹ thuật hiện đại về công nghệ sinh học phục vụ sản xuất, bảo quản, chế biến các sản phẩm nông nghiệp, y tế và môi trường. - Dịch vụ KH&CN: Tư vấn kỹ thuật, tổ chức huấn luyện, bồi dưỡng thực nghiệm, chuyển giao công nghệ, phổ cập kiến thức công nghệ sinh học. - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký.'
