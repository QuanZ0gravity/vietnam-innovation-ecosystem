description:
  vi: Tổ chức khoa học và công nghệ tại TP.HCM.
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: kỹ thuật xây dựng, công trình hạ tầng đô thị, công trình giao thông vận tải, công trình thủy lợi, địa kỹ thuật. 2. Dịch vụ khoa học và công nghệ: chuyển giao công nghệ, tổ chức hội nghị, hội thảo, bồi dưỡng chuyên môn theo lĩnh vực đăng ký phù hợp Luật định (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 3. Kinh doanh và sản xuất kinh doanh các sản phẩm là kết quả nghiên cứu.'
