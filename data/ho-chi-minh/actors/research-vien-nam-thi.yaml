id: research-vien-nam-thi
name:
  vi: Viện Nam Thi
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 129B, Võ Văn Tần, Phường Xuân Hòa, Thành phố Hồ Chí Minh
description:
  vi: Tổ chức khoa học và công nghệ tại TP.HCM, trực thuộc Viện Nam Thi.
description_source:
  text: '1. Hoạt động nghiên cứu khoa học và triển khai ứng dụng trong các lĩnh vực: Ngôn ngữ học và văn học, nghệ thuật, lịch sử và khảo cổ học, xã hội học, khoa học giáo dục nói chung. 2. Hoạt động kinh doanh và sản xuất kinh doanh các sản phẩm hình thành từ kết quả nghiên cứu khoa học công nghệ. 3. Hoạt động dịch vụ khoa học công nghệ: Tổ chức sự kiện, hội nghị, hội thảo, trưng bày, triển lãm. Bảo tồn các giá trị vật thể và phi vật thể liên quan đến lĩnh vực khoa học công nghệ đăng ký. Tư vấn và chuyển giao kết quả nghiên cứu từ quá trình nghiên cứu khoa học công nghệ. Tập huấn, bồi dưỡng kiến thức chuyên môn theo lĩnh vực khoa học công nghệ đăng ký (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp với Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
