id: research-trung-tam-nghien-cuu-va-phat-trien-tsl
name:
  vi: Trung Tâm Nghiên Cứu Và Phát Triển Tsl
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 592A, Cộng Hòa, Phường Tân Sơn, TP. Hồ Chí Minh
description:
  vi: Tổ chức khoa học và công nghệ tại TP.HCM, trực thuộc Công ty TNHH Khoa học TSL.
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: Vệ sinh an toàn thực phẩm; Hóa phân tích; Hóa học cao phân tử; Các vấn đề chung về hóa học công nghiệp; Quá trình và thiết bị công nghệ hóa học; Sinh học lý thuyết; Vi sinh vật học; Sinh học phân tử. 2. Kinh doanh, sản xuất kinh doanh, sản xuất thử nghiệm các sản phẩm hình thành từ kết quả nghiên cứu. 3. Dịch vụ khoa học và công nghệ: Tổ chức hội nghị, hội thảo, Thông tin khoa học và công nghệ; Dịch vụ môi giới chuyển giao công nghệ, Dịch vụ tư vấn chuyển giao công nghệ; Dịch vụ thử nghiệm chất lượng sản phẩm hàng hóa; Kiểm định, hiệu chuẩn phương tiện đo; Dịch vụ giám định số lượng, chất lượng sản phẩm, hàng hóa; Tư vấn, phản biện, đánh giá, chuyển giao kết quả nghiên cứu khoa học trong lĩnh vực đăng ký; Tập huấn, bồi dưỡng chuyên môn cho các tổ chức, cá nhân có nhu cầu theo các lĩnh vực đăng ký trên. 4. Hợp tác với các tổ chức, cá nhân trong và ngoài nước theo các lĩnh vực đăng ký phù hợp với luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
